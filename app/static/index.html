<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de Talhões</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f3f4ef; --fg:#1d2418; --muted:#5f6a57; --line:#d5d9cc; --accent:#3d6b1f; --talhao:#ffd23f; --perene:#2ee6a6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  aside { padding: 16px; overflow: auto; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  #mapa { height: 100%; }
  h1 { font-size: 18px; margin: 0; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; font: 13px ui-monospace, monospace; }
  .row { display: flex; gap: 8px; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  td.n { text-align: right; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; } aside { border-right: 0; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Teste de Talhões</h1>
    <div>
      <label for="car">Código do CAR</label>
      <input id="car" value="SP-3543402-188EDB67444F4A428CDAC2174BDFDD9D">
    </div>
    <div class="row">
      <div style="flex:1"><label for="sens">Sensibilidade</label><input id="sens" type="number" step="0.1" value="0.7"></div>
      <div style="flex:1"><label for="amin">Área mín. (ha)</label><input id="amin" type="number" step="0.5" value="2"></div>
    </div>
    <div class="row">
      <button id="btnCar">Buscar pelo CAR</button>
      <button id="btnDesenhar" class="sec">Desenhar área</button>
    </div>
    <div id="status">Leva de 20 s a 1 min (baixa as imagens de satélite na hora).</div>
    <div id="resumo"></div>
    <button id="btnBaixar" class="sec" hidden>Baixar GeoJSON</button>
  </aside>
  <div id="mapa"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mapa = L.map('mapa').setView([-21.17, -47.81], 12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Imagem: Esri' }).addTo(mapa);
let camada, perimetro, ultimo, desenhando = false, pontos = [], rascunho;
const $ = id => document.getElementById(id);
const cor = c => c === 'talhão' ? getComputedStyle(document.documentElement).getPropertyValue('--talhao')
                                 : getComputedStyle(document.documentElement).getPropertyValue('--perene');

function mostrar(fc) {
  ultimo = fc;
  camada && camada.remove(); perimetro && perimetro.remove();
  const im = fc.metadata.imovel;
  if (im && im.perimetro) perimetro = L.geoJSON(im.perimetro, { style: { color: '#fff', weight: 2, dashArray: '6 4', fill: false } }).addTo(mapa);
  camada = L.geoJSON(fc, {
    style: f => ({ color: cor(f.properties.classe), weight: 2, fillOpacity: .12 }),
    onEachFeature: (f, l) => l.bindTooltip(`${f.properties.id} · ${f.properties.area_ha} ha · ${f.properties.classe}`)
  }).addTo(mapa);
  mapa.fitBounds(camada.getBounds(), { padding: [20, 20] });
  const m = fc.metadata;
  const linhas = fc.features.map(f => `<tr><td><span class="dot" style="background:${cor(f.properties.classe)}"></span>${f.properties.id}</td><td>${f.properties.classe}</td><td class="n">${f.properties.area_ha.toFixed(2)}</td></tr>`).join('');
  $('resumo').innerHTML = `<p><b>${m.qtd_talhoes}</b> talhões + ${m.qtd_outras_areas} outras áreas · ${m.area_total_ha} ha · ${m.tempo_s}s<br>
    Imagens: ${m.cenas.map(c => c.data).join(', ')}</p>
    <table><tr><th>ID</th><th>Classe</th><th class="n">ha</th></tr>${linhas}</table>`;
  $('btnBaixar').hidden = false;
}

async function chamar(url, opcoes = {}) {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  const t0 = Date.now();
  const ctrl = new AbortController();
  const limite = setTimeout(() => ctrl.abort(), 240000);
  const relogio = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    $('status').textContent = `Processando… ${s}s` + (s > 60 ? ' (servidor grátis acordando ou fazenda grande, aguarde)' : '');
  }, 1000);
  $('status').textContent = 'Processando… 0s';
  try {
    const r = await fetch(url, { ...opcoes, signal: ctrl.signal });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    mostrar(j); $('status').textContent = `Pronto em ${Math.round((Date.now() - t0) / 1000)}s.`;
  } catch (e) {
    $('status').textContent = e.name === 'AbortError'
      ? 'Passou de 4 minutos sem resposta. Tente de novo (o servidor já deve estar acordado).'
      : 'Erro: ' + e.message;
  }
  clearInterval(relogio); clearTimeout(limite);
  document.querySelectorAll('button').forEach(b => b.disabled = false);
}
const params = () => `&sensibilidade=${$('sens').value}&area_min_ha=${$('amin').value}`;

$('btnCar').onclick = () => chamar(`/talhoes?car=${encodeURIComponent($('car').value.trim())}${params()}`);

$('btnDesenhar').onclick = () => {
  if (!desenhando) {
    desenhando = true; pontos = []; $('btnDesenhar').textContent = 'Concluir área';
    $('status').textContent = 'Clique no mapa para marcar os cantos da área.';
    return;
  }
  desenhando = false; $('btnDesenhar').textContent = 'Desenhar área';
  if (pontos.length < 3) { $('status').textContent = 'Marque pelo menos 3 pontos.'; return; }
  const anel = pontos.map(p => [p.lng, p.lat]); anel.push(anel[0]);
  rascunho && rascunho.remove();
  chamar('/talhoes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ geometry: { type: 'Polygon', coordinates: [anel] },
      sensibilidade: +$('sens').value, area_min_ha: +$('amin').value }) });
};
mapa.on('click', e => {
  if (!desenhando) return;
  pontos.push(e.latlng);
  rascunho && rascunho.remove();
  rascunho = L.polygon(pontos, { color: '#fff', weight: 2, dashArray: '4 4' }).addTo(mapa);
});
$('btnBaixar').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(ultimo)], { type: 'application/geo+json' }));
  a.download = 'talhoes.geojson'; a.click();
};
</script>
</body>
</html>
